<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sammlungssuche</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600;700&display=swap');

:root{
  --bg:#f6f5f1;
  --panel:#ffffff;
  --panel-soft:#efeee9;
  --line:#e0ddd5;
  --line-strong:#cfccc2;
  --ink:#23262b;
  --ink-dim:#7c7d78;

  /* Bereichsfarben */
  --phys:#1d3a5f;        /* dunkelblau */
  --phys-bg:#eaeff5;
  --phys-line:#c2d0e0;
  --chem:#9e2a2b;        /* rot */
  --chem-bg:#f7eaea;
  --chem-line:#e3c4c4;
  --neutral:#6b6c67;
  --neutral-bg:#eeede9;
  --neutral-line:#dcd9d1;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif;
  line-height:1.45;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px;margin:0 auto;
  padding:0 calc(18px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}

header{
  position:sticky;top:0;z-index:50;
  margin:0 calc(-18px - env(safe-area-inset-right)) 0 calc(-18px - env(safe-area-inset-left));
  padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 14px calc(18px + env(safe-area-inset-left));
  background:rgba(246,245,241,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.title-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(24px,5.5vw,34px);
  letter-spacing:-.01em;line-height:1;color:var(--ink)}
.sub{font-size:13px;color:var(--ink-dim);font-weight:500}
.count-pill{margin-left:auto;font-size:12px;font-weight:600;color:#fff;
  background:var(--ink);padding:3px 11px;border-radius:999px;white-space:nowrap}

.search-box{position:relative}
.search-box svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  width:19px;height:19px;stroke:var(--ink-dim);pointer-events:none}
#q{width:100%;font-size:17px;font-family:inherit;font-weight:500;color:var(--ink);
  background:var(--panel);border:1.5px solid var(--line-strong);border-radius:12px;
  padding:14px 44px 14px 44px;outline:none;transition:border-color .15s,box-shadow .15s}
#q::placeholder{color:var(--ink-dim)}
#q:focus{border-color:var(--phys);box-shadow:0 0 0 3px rgba(29,58,95,.12)}
.clear-btn{position:absolute;right:9px;top:50%;transform:translateY(-50%);
  background:var(--panel-soft);border:none;color:var(--ink-dim);width:28px;height:28px;
  border-radius:50%;font-size:18px;cursor:pointer;display:none;align-items:center;
  justify-content:center;line-height:1}
.clear-btn.show{display:flex}

/* Bereichsumschalter */
.scopes{display:flex;gap:8px;margin-top:12px}
.scope{flex:1;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  background:var(--panel);color:var(--ink-dim);border:1.5px solid var(--line-strong);
  border-radius:10px;padding:9px 6px;transition:all .14s;text-align:center}
.scope:hover{border-color:var(--ink-dim)}
.scope[data-s="all"].active{background:var(--ink);border-color:var(--ink);color:#fff}
.scope[data-s="phys"].active{background:var(--phys);border-color:var(--phys);color:#fff}
.scope[data-s="chem"].active{background:var(--chem);border-color:var(--chem);color:#fff}
.scope[data-r].active{background:var(--ink);border-color:var(--ink);color:#fff}
.rooms{margin-top:8px}

/* Steuerzeile: Themen-Dropdown + Sortierung */
.controls{display:flex;gap:8px;margin-top:12px;align-items:stretch}

.dropdown{position:relative;flex:1;min-width:0}
.dd-toggle{width:100%;display:flex;align-items:center;gap:8px;font-family:inherit;
  font-size:13.5px;font-weight:600;cursor:pointer;background:var(--panel);color:var(--ink);
  border:1.5px solid var(--line-strong);border-radius:10px;padding:10px 12px;text-align:left;
  transition:border-color .15s,box-shadow .15s}
.dd-toggle .dd-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-toggle .dd-n{font-size:11px;font-weight:700;color:#fff;background:var(--ink);
  padding:2px 8px;border-radius:999px;flex-shrink:0}
.dd-toggle svg{width:16px;height:16px;stroke:var(--ink-dim);flex-shrink:0}
.dd-toggle .dd-chev{transition:transform .18s}
.dropdown.open .dd-toggle{border-color:var(--phys);box-shadow:0 0 0 3px rgba(29,58,95,.12)}
.dropdown.open .dd-toggle .dd-chev{transform:rotate(180deg)}

.dd-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;
  background:var(--panel);border:1.5px solid var(--line-strong);border-radius:12px;
  box-shadow:0 12px 34px rgba(0,0,0,.16);padding:6px;max-height:min(60vh,360px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.dropdown.open .dd-menu{display:block;animation:rise .16s ease backwards}
.dd-item{width:100%;display:flex;align-items:center;gap:10px;font-family:inherit;
  font-size:14.5px;font-weight:600;cursor:pointer;background:transparent;color:var(--ink);
  border:none;border-radius:8px;padding:11px 12px;text-align:left}
.dd-item:hover{background:var(--panel-soft)}
.dd-item.active{background:var(--panel-soft)}
.dd-check{width:19px;height:19px;flex-shrink:0;border:1.8px solid var(--line-strong);
  border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .12s}
.dd-item.active .dd-check{background:var(--phys);border-color:var(--phys)}
.dd-check svg{width:13px;height:13px;opacity:0;transition:opacity .12s}
.dd-item.active .dd-check svg{opacity:1}
.dd-item .dd-it-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-item .dd-n{font-size:12px;color:var(--ink-dim);opacity:.7;flex-shrink:0}
.dd-divider{height:1px;background:var(--line);margin:5px 8px}

.sort-dd{flex:0 0 auto;min-width:138px}

.results{margin-top:22px;display:flex;flex-direction:column;gap:9px}

.card{background:var(--panel);border:1px solid var(--line);border-left-width:5px;
  border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:14px;
  animation:rise .28s ease backwards}
.card.phys{border-left-color:var(--phys);background:linear-gradient(90deg,var(--phys-bg),var(--panel) 38%)}
.card.chem{border-left-color:var(--chem);background:linear-gradient(90deg,var(--chem-bg),var(--panel) 38%)}
.card.neutral{border-left-color:var(--neutral)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.loc{flex-shrink:0;text-align:center;min-width:70px;border-radius:9px;padding:8px 7px;
  background:var(--panel-soft);border:1px solid var(--line)}
.card.phys .loc{background:var(--phys-bg);border-color:var(--phys-line)}
.card.chem .loc{background:var(--chem-bg);border-color:var(--chem-line)}
.loc .code{font-family:'Fraunces',serif;font-weight:700;font-size:18px;letter-spacing:.01em;line-height:1;color:var(--ink)}
.card.phys .loc .code{color:var(--phys)}
.card.chem .loc .code{color:var(--chem)}
.loc .lbl{font-size:9px;color:var(--ink-dim);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:5px}

.info{flex:1;min-width:0}
.info .name{font-size:16px;font-weight:600;color:var(--ink);line-height:1.25}
.info .name mark{background:rgba(255,210,90,.55);color:var(--ink);border-radius:3px;padding:0 2px}
.tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px;cursor:pointer;
  color:var(--ink-dim);background:var(--panel-soft);border:1px solid var(--line)}
.card.phys .tag{color:var(--phys);background:var(--phys-bg);border-color:var(--phys-line)}
.card.chem .tag{color:var(--chem);background:var(--chem-bg);border-color:var(--chem-line)}
.tag:hover{filter:brightness(.96)}
.loc-detail{font-size:11px;color:var(--ink-dim);margin-top:6px;font-weight:500}
.loc-detail .room{font-weight:700;color:var(--ink)}

.empty{text-align:center;padding:56px 20px;color:var(--ink-dim)}
.empty .big{font-family:'Fraunces',serif;font-size:44px;margin-bottom:10px;opacity:.35}
.empty p{font-size:15px}
.empty .hint{font-size:13px;margin-top:6px;opacity:.75}

.legend{display:flex;gap:16px;justify-content:center;margin-top:34px;font-size:12px;color:var(--ink-dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend .p{background:var(--phys)}.legend .c{background:var(--chem)}.legend .nu{background:var(--neutral)}
footer{margin-top:14px;text-align:center;font-size:12px;color:var(--ink-dim);opacity:.7}

/* Tablet / iPad: etwas mehr Luft */
@media (min-width:700px){
  .card{padding:15px 18px}
  .loc{min-width:80px}
}

/* Smartphone */
@media (max-width:560px){
  .wrap{padding:0 calc(13px + env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) calc(13px + env(safe-area-inset-left))}
  header{margin:0 calc(-13px - env(safe-area-inset-right)) 0 calc(-13px - env(safe-area-inset-left));
    padding:calc(14px + env(safe-area-inset-top)) calc(13px + env(safe-area-inset-right)) 12px calc(13px + env(safe-area-inset-left))}
  .title-row{gap:6px 10px;margin-bottom:12px}
  .scopes,.controls{gap:6px}
  .results{margin-top:16px;gap:8px}
  .card{padding:12px 13px;gap:11px}
  .loc{min-width:62px;padding:7px 5px}
  .loc .code{font-size:16px}
  .info .name{font-size:15.5px}
}

/* sehr schmal: Steuerzeile umbrechen */
@media (max-width:380px){
  .controls{flex-wrap:wrap}
  .sort-dd{flex:1 1 100%;min-width:0}
}

/* Touch-Geräte: kein Hover-Flackern, größere Tippziele */
@media (hover:none){
  .dd-item{padding:14px 12px}
}
</style>
</head>

<div class="wrap">
  <header>
    <div class="title-row">

        placeholder="Suchen … z. B. Stoppuhr, Erlenmeyer, Spule">

        </button>
        <div class="dd-menu" id="topicMenu" role="listbox"></div>
      </div>
      <div class="dropdown sort-dd" id="sortDD">
        <button class="dd-toggle" id="sortToggle" type="button" aria-haspopup="listbox" aria-expanded="false">

          <svg class="dd-chev" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="dd-menu" id="sortMenu" role="listbox"></div>
      </div>
    </div>
  </header>

  <div class="results" id="results"></div>

  <div class="legend">
    <span><i class="p"></i>Physik</span>
    <span><i class="c"></i>Chemie</span>
    <span><i class="nu"></i>Allgemein</span>
  </div>
  <footer>209 Gegenst&auml;nde &middot; offline nutzbar</footer>
</div>

// --- Bereichszuordnung: welche Themenfelder sind Chemie? ---
// (leicht anpassbar: hier stehen die Chemie-Schlagworte)
const CHEM_TOPICS = ['Laborgeräte','Sicherheit'];
const NEUTRAL_TOPICS = ['Allgemein','Zubehör'];

function topicsOf(s){return (s||'').split('/').map(t=>t.trim()).filter(Boolean);}

function areaOf(d){
  const ts=topicsOf(d.Themenfeld);
  if(ts.some(t=>CHEM_TOPICS.includes(t))) return 'chem';
  if(ts.every(t=>NEUTRAL_TOPICS.includes(t))) return 'neutral';
  return 'phys';
}
DATA.forEach(d=>{d._area=areaOf(d);});

// Themen zaehlen
const topicCount={};
DATA.forEach(d=>{const seen=new Set();
  topicsOf(d.Themenfeld).forEach(t=>{if(!seen.has(t)){seen.add(t);topicCount[t]=(topicCount[t]||0)+1;}});});
const topics=Object.keys(topicCount).sort((a,b)=>topicCount[b]-topicCount[a]||a.localeCompare(b,'de'));

function norm(s){return (s||'').toLowerCase()
  .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss')
  .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 99;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[m][n];}
DATA.forEach(d=>{d._name=norm(d.Inhalt);
  const loc='schrank '+d.Schrank+' fach '+d.Fach+' kiste '+d.Kiste;
  d._all=norm(d.Inhalt)+' '+norm(d.Themenfeld)+' '+norm(loc)+' '+norm(d.Standort);
  d._tokens=d._all.split(' ').filter(Boolean);});

function numOf(v){const m=(''+v).match(/\d+/);return m?parseInt(m[0],10):0;}
const SORT_KEYS={
  loc:d=>[numOf(d.Schrank),numOf(d.Fach),numOf(d.Kiste),''+d.Kiste],
  schrank:d=>[numOf(d.Schrank),numOf(d.Fach),numOf(d.Kiste),''+d.Kiste],
  fach:d=>[numOf(d.Fach),numOf(d.Schrank),numOf(d.Kiste),''+d.Kiste],
  kiste:d=>[numOf(d.Kiste),''+d.Kiste,numOf(d.Schrank),numOf(d.Fach)]
};
function cmpArr(a,b){for(let i=0;i<a.length;i++){const x=a[i],y=b[i];
  if(typeof x==='number'&&typeof y==='number'){if(x!==y)return x-y;}
  else{const r=(''+x).localeCompare(''+y,'de');if(r)return r;}}return 0;}
const SORTS=[['loc','Standort'],['az','Name (A–Z)'],['schrank','Schrank'],['fach','Fach'],['kiste','Kiste']];

let activeTopics=new Set(), activeScope='all', activeRoom='all', activeSort='loc';
const qEl=document.getElementById('q'),resultsEl=document.getElementById('results'),
  clearBtn=document.getElementById('clearBtn'),countPill=document.getElementById('countPill'),
  topicDD=document.getElementById('topicDD'),topicToggle=document.getElementById('topicToggle'),
  topicLabel=document.getElementById('topicLabel'),topicCountEl=document.getElementById('topicCount'),
  topicMenu=document.getElementById('topicMenu'),
  sortDD=document.getElementById('sortDD'),sortToggle=document.getElementById('sortToggle'),
  sortLabel=document.getElementById('sortLabel'),sortMenu=document.getElementById('sortMenu');

function scopeMatch(d){return activeScope==='all'||d._area===activeScope
  ||(activeScope==='phys'&&d._area==='neutral'&&false);}
// neutral nur unter "Alle" zeigen
function inScope(d){if(activeScope==='all')return true;return d._area===activeScope;}
function inRoom(d){return activeRoom==='all'||d.Standort===activeRoom;}

const CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-11"/></svg>';
function buildTopicMenu(){
  topicMenu.innerHTML='';
  const pool=DATA.filter(d=>inScope(d)&&inRoom(d));
  const cnt={};pool.forEach(d=>{const seen=new Set();
    topicsOf(d.Themenfeld).forEach(t=>{if(!seen.has(t)){seen.add(t);cnt[t]=(cnt[t]||0)+1;}});});
  const list=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b,'de'));
  const mk=(label,topic,count,active)=>{
    const b=document.createElement('button');
    b.type='button';b.className='dd-item'+(active?' active':'');
    b.setAttribute('role','option');b.setAttribute('aria-selected',active?'true':'false');
    b.innerHTML='<span class="dd-check">'+CHECK_SVG+'</span>'
      +'<span class="dd-it-label">'+escapeHtml(label)+'</span><span class="dd-n">'+count+'</span>';
    b.onclick=e=>{e.stopPropagation();
      if(topic===null){activeTopics.clear();}
      else if(activeTopics.has(topic)){activeTopics.delete(topic);}
      else{activeTopics.add(topic);}
      render();buildTopicMenu();};
    topicMenu.appendChild(b);
  };
  mk('Alle Themen',null,pool.length,activeTopics.size===0);
  const div=document.createElement('div');div.className='dd-divider';topicMenu.appendChild(div);
  list.forEach(t=>mk(t,t,cnt[t],activeTopics.has(t)));
  const matched=pool.filter(matchesTopic).length;
  if(activeTopics.size===0){topicLabel.textContent='Alle Themen';}
  else if(activeTopics.size===1){topicLabel.textContent=[...activeTopics][0];}
  else{topicLabel.textContent=activeTopics.size+' Themen';}
  topicCountEl.textContent=matched;
}

function setOpen(dd,tog,open){dd.classList.toggle('open',open);tog.setAttribute('aria-expanded',open?'true':'false');}
function closeDD(){setOpen(topicDD,topicToggle,false);}
function closeSortDD(){setOpen(sortDD,sortToggle,false);}

  setOpen(topicDD,topicToggle,!topicDD.classList.contains('open'));});
sortToggle.addEventListener('click',e=>{e.stopPropagation();closeDD();
  setOpen(sortDD,sortToggle,!sortDD.classList.contains('open'));});

  if(!topicDD.contains(e.target))closeDD();
  if(!sortDD.contains(e.target))closeSortDD();});

function buildSortMenu(){
  sortMenu.innerHTML='';
  SORTS.forEach(([key,label])=>{
    const active=activeSort===key;
    const b=document.createElement('button');b.type='button';
    b.className='dd-item'+(active?' active':'');
    b.setAttribute('role','option');b.setAttribute('aria-selected',active?'true':'false');
    b.innerHTML='<span class="dd-check">'+CHECK_SVG+'</span><span class="dd-it-label">'+label+'</span>';
    b.onclick=e=>{e.stopPropagation();activeSort=key;closeSortDD();render();buildSortMenu();};
    sortMenu.appendChild(b);
  });
  const cur=SORTS.find(s=>s[0]===activeSort);if(cur)sortLabel.textContent=cur[1];
}

function matchesTopic(d){if(activeTopics.size===0)return true;
  return topicsOf(d.Themenfeld).some(t=>activeTopics.has(t));}

function score(d,terms){if(!terms.length)return 0;let total=0;
  for(const term of terms){let best=99;
    if(d._all.includes(term)){best=0;}
    else{for(const tok of d._tokens){
      if(tok.startsWith(term)){best=Math.min(best,0.5);continue;}
      if(term.length>=4){const dist=lev(term,tok);if(dist<=2)best=Math.min(best,dist);}}}
    if(best>=99)return -1;total+=best;}
  return total;}

function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function highlight(text,terms){if(!terms.length)return escapeHtml(text);
  let out=escapeHtml(text);
  [...new Set(terms)].filter(t=>t.length>=2).sort((a,b)=>b.length-a.length).forEach(t=>{
    try{const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');out=out.replace(re,'<mark>$1</mark>');}catch(e){}});
  return out;}

function render(){
  const raw=qEl.value.trim();
  const terms=norm(raw).split(' ').filter(Boolean);
  clearBtn.classList.toggle('show',raw.length>0);
  let rows=DATA.filter(d=>inScope(d)&&inRoom(d)&&matchesTopic(d));
  if(terms.length){rows=rows.map(d=>({d,s:score(d,terms)})).filter(x=>x.s>=0)
    .sort((a,b)=>a.s-b.s).map(x=>x.d);}
  else if(activeSort==='az'){
    rows=[...rows].sort((a,b)=>a.Inhalt.localeCompare(b.Inhalt,'de',{sensitivity:'base'}));}
  else{const kf=SORT_KEYS[activeSort]||SORT_KEYS.loc;
    rows=[...rows].sort((a,b)=>cmpArr(kf(a),kf(b)));}
  countPill.textContent=rows.length+' Treffer';
  if(!rows.length){resultsEl.innerHTML='<div class="empty"><div class="big">&#8709;</div><p>Nichts gefunden.</p><p class="hint">Anderen Begriff probieren, Themenfeld oder Bereich zur&uuml;cksetzen.</p></div>';return;}
  let html='';
  rows.forEach((d,i)=>{
    const code=escapeHtml(d.Schrank)+'-'+escapeHtml(d.Fach)+'-'+escapeHtml(d.Kiste);
    const tags=topicsOf(d.Themenfeld).map(t=>'<span class="tag" data-topic="'+escapeHtml(t)+'">'+escapeHtml(t)+'</span>').join('');
    html+='<div class="card '+d._area+'" style="animation-delay:'+Math.min(i*16,280)+'ms">'
      +'<div class="loc"><div class="code">'+code+'</div><div class="lbl">Position</div></div>'
      +'<div class="info"><div class="name">'+highlight(d.Inhalt,terms)+'</div>'
      +'<div class="tags">'+tags+'</div>'
      +'<div class="loc-detail">'+(d.Standort?'<span class="room">'+escapeHtml(d.Standort)+'</span> &middot; ':'')+'Schrank '+escapeHtml(d.Schrank)+' &middot; Fach '+escapeHtml(d.Fach)+' &middot; Kiste '+escapeHtml(d.Kiste)+'</div></div></div>';});
  resultsEl.innerHTML=html;
  resultsEl.querySelectorAll('.tag').forEach(el=>{el.onclick=()=>{activeTopics=new Set([el.dataset.topic]);qEl.value='';render();buildTopicMenu();window.scrollTo({top:0,behavior:'smooth'});};});
}

document.getElementById('scopes').addEventListener('click',e=>{
  const b=e.target.closest('.scope');if(!b)return;
  activeScope=b.dataset.s;activeTopics.clear();
  document.querySelectorAll('#scopes .scope').forEach(s=>s.classList.toggle('active',s===b));
  render();buildTopicMenu();});
document.getElementById('rooms').addEventListener('click',e=>{
  const b=e.target.closest('.scope');if(!b)return;
  activeRoom=b.dataset.r;
  document.querySelectorAll('#rooms .scope').forEach(s=>s.classList.toggle('active',s===b));
  render();buildTopicMenu();});
qEl.addEventListener('input',render);
clearBtn.addEventListener('click',()=>{qEl.value='';qEl.focus();render();});

buildTopicMenu();buildSortMenu();render();
</script>
</body>
</html>
